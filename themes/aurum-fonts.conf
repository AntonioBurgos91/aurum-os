<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Make sans-serif resolve to Inter for AurumOS-native apps -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Inter Display</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <!-- Better rendering on Wayland: subpixel rgb + slight hinting -->
  <match target="font">
    <edit name="hinting"><bool>true</bool></edit>
    <edit name="hintstyle"><const>hintslight</const></edit>
    <edit name="rgba"><const>rgb</const></edit>
    <edit name="lcdfilter"><const>lcddefault</const></edit>
  </match>
</fontconfig>
