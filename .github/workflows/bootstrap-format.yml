name: Bootstrap Format

# Runs formatters + lint diagnostics. Writes both code fixes AND
# diagnostic reports directly to the repo, so they can be read via API.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create reports dir
        run: mkdir -p .ci-reports

      # ---------- Rust ----------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: cargo fmt
        run: |
          set +e
          {
            echo "=== cargo fmt diagnostic report ==="
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker tools/aurum-mockup; do
              if [ -f "$d/Cargo.toml" ]; then
                echo "--- $d ---"
                cargo fmt --manifest-path "$d/Cargo.toml" --check 2>&1
                echo "exit_code: $?"
                # Now apply for real
                cargo fmt --manifest-path "$d/Cargo.toml"
              fi
            done
          } | tee .ci-reports/rustfmt.txt

      - name: cargo clippy (diagnostic only)
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== cargo clippy diagnostic report ==="
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker; do
              if [ -f "$d/Cargo.toml" ]; then
                echo ""
                echo "===================================="
                echo "Crate: $d"
                echo "===================================="
                cargo clippy --manifest-path "$d/Cargo.toml" --release --message-format=human -- -D warnings 2>&1
                echo ""
                echo "clippy exit: $?"
              fi
            done
          } | tee .ci-reports/clippy.txt

      # ---------- C++ ----------
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: clang-format diagnostic + apply
        run: |
          set +e
          {
            echo "=== clang-format diagnostic report ==="
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "clang-format version: $(clang-format --version)"
            echo ""
            echo "--- Files that would change ---"
            find desktop libs \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" \) -type f 2>/dev/null | while read f; do
              if ! clang-format --dry-run --Werror "$f" 2>&1 | grep -q "^$"; then
                echo "would change: $f"
              fi
            done
            echo ""
          } | tee .ci-reports/clang-format.txt

          # Apply for real
          find desktop libs \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" \) -type f -print0 2>/dev/null \
            | xargs -0 -r clang-format -i || true

      # ---------- Shellcheck ----------
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck diagnostic
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== shellcheck diagnostic report ==="
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "shellcheck version: $(shellcheck --version | head -2 | tail -1)"
            echo ""
          } > .ci-reports/shellcheck.txt

          find . -name "*.sh" \
            -not -path "./build/*" \
            -not -path "./target/*" \
            -not -path "./.git/*" \
            -not -path "./.ci-reports/*" \
            -print0 \
          | xargs -0 -r shellcheck -S warning -f gcc >> .ci-reports/shellcheck.txt 2>&1 || true

          echo "" >> .ci-reports/shellcheck.txt
          echo "Total lines: $(wc -l < .ci-reports/shellcheck.txt)" >> .ci-reports/shellcheck.txt

      # ---------- Summary ----------
      - name: Generate summary
        run: |
          {
            echo "# CI Bootstrap Format Report"
            echo ""
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo "## Counts"
            echo ""
            echo "- shellcheck issues:  $(grep -c -E "(warning|error):" .ci-reports/shellcheck.txt 2>/dev/null || echo 0)"
            echo "- clippy warnings:    $(grep -c "^warning:" .ci-reports/clippy.txt 2>/dev/null || echo 0)"
            echo "- clippy errors:      $(grep -c "^error:" .ci-reports/clippy.txt 2>/dev/null || echo 0)"
            echo "- clang-format files: $(grep -c "would change:" .ci-reports/clang-format.txt 2>/dev/null || echo 0)"
            echo ""
            echo "See individual files for details."
          } > .ci-reports/SUMMARY.md

      # ---------- Commit ALL: code fixes + reports ----------
      - name: Commit code + reports
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "ci(reports): regenerate lint diagnostics + format fixes [skip ci]

Reports committed to .ci-reports/:
- shellcheck.txt
- clippy.txt
- rustfmt.txt
- clang-format.txt
- SUMMARY.md"
          git push
          echo "Pushed."
