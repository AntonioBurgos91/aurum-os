name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-iso:
    runs-on: ubuntu-24.04   # TODO: replace with self-hosted runner for proper ISO build
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO build deps
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools xorriso wget rsync
      - name: Build ISO
        run: sudo ./distro/iso-builder/build.sh
      - name: Compute SHA-256
        run: cd build && sha256sum *.iso > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.iso
            build/SHA256SUMS
          generate_release_notes: true
