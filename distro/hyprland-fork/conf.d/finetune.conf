# AurumOS — Hyprland windowrule for aurum-finetune (Agent A / Wave 8)
#
# The .desktop entry launches `xterm -class aurum-finetune ...`. Hyprland
# matches by the X11 WM_CLASS / Wayland app_id, so the class string here must
# match the StartupWMClass value in desktop/applications/aurum-finetune.desktop.
#
# Sourced from distro/hyprland-fork/aurum.conf via:
#     source = /etc/aurum/hypr/conf.d/*.conf

windowrule = match:class aurum-finetune, float on
windowrule = match:class aurum-finetune, size 1100 700
windowrule = match:class aurum-finetune, center on
