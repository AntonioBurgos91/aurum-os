# ==============================================================================
# AurumOS compositor-level defaults (Hyprland v0.50+ syntax)
# Sourced from user hyprland.conf via `source = /etc/aurum/hypr/aurum.conf`.
# Users override by setting any value AFTER this source line in their own conf.
#
# v0.50+ changes vs older Hyprland we previously targeted:
#   * decoration:drop_shadow / shadow_range / shadow_render_power / col.shadow
#     were collapsed into a nested decoration:shadow {} block.
#   * windowrulev2 → windowrule (the v2 was made the default and the suffix
#     dropped).
#   * dwindle:pseudotile remains, but is set via dispatcher these days; we
#     drop it from the static config to avoid "option does not exist" errors
#     on Hyprland builds that removed the static form.
# ==============================================================================

# --- Drop-in directory for per-app rules added by Wave 8/9 agents -------------
# Each agent owns its own file under /etc/aurum/hypr/conf.d/ (vLLM, ComfyUI,
# Continue.dev, Langfuse, …) so this canonical file stays stable. Hyprland
# silently no-ops if the glob matches zero files, so this is safe on minimal
# installs that ship just aurum.conf.
source = /etc/aurum/hypr/conf.d/*.conf

# --- macOS Sequoia visual identity ---
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(a0a0a0ff) rgba(606060ff) 45deg
    col.inactive_border = rgba(303030ff)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# --- Environment for compositor children ---
# Hyprland strips PATH from its own env on some installs; explicitly set the
# search path so spawned children (Qt apps, hyprctl invoked from inside the
# dock for dedup, etc.) can find /usr/bin/hyprctl etc. We also set
# XDG_DATA_DIRS so desktop-entry lookups see /usr/local + /usr.
env = PATH,/usr/local/bin:/usr/bin:/bin
env = XDG_DATA_DIRS,/usr/local/share:/usr/share:/var/lib/flatpak/exports/share

decoration {
    rounding = 12

    # Subtle macOS-style drop shadow. Nested `shadow {}` is the v0.50+
    # replacement for the flat drop_shadow / shadow_range / col.shadow keys.
    shadow {
        enabled       = true
        range         = 15
        render_power  = 3
        color         = rgba(00000040)
    }

    # Blur intentionally off: a deep-learning box should not burn GPU on
    # window backgrounds while a model is training (ADR-0006).
    blur {
        enabled = false
    }
}

# --- Animations: policy lives in conf.d/animations.conf (Wave 10F) ----------
# Selective fades for window-open / window-close only (150ms popin). Workspace,
# border and layout animations remain off so DL training sees a steady
# compositor frametime. Users override by dropping a higher-numbered drop-in
# (e.g. /etc/aurum/hypr/conf.d/99-user-animations.conf). See docs/adr/
# 0006-selective-animations.md for the rationale (supersedes the original
# "all-off" decision once we proved animations don't fire while training).

# --- Layout ---
dwindle {
    preserve_split = true
    smart_split    = false
    smart_resizing = true
}

master {
    new_status = master
}

# --- Compositor misc ---
# Hyprland 0.53+ removed misc:vfr (handled per-monitor now) — omit it here.
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    force_default_wallpaper  = 0
    vrr                      = 1
    enable_swallow           = false
    focus_on_activate        = false
}

# --- XWayland ---
xwayland {
    force_zero_scaling = true
}

# --- Float rules for AurumOS-native applets -----------------------------------
# Hyprland 0.53+ rewrote the windowrule grammar.
# Old (≤0.52): `windowrule = float, class:aurum-menubar`
# New (≥0.53): `windowrule = match:class aurum-menubar, float on`
#                              ^matcher first^         ^action+value^
# Also: `noborder` was removed — there is no per-window border toggle in 0.53+.
# We accept the 1 px global border (general:border_size = 1) on menubar/dock;
# both already draw their own visual divider/glass-edge that hides it.
# `rounding 0` and `move X Y` survive unchanged (just behind the matcher now).

# aurum-menubar: top strip, full width, pinned across workspaces.
windowrule = match:class aurum-menubar, float on
windowrule = match:class aurum-menubar, pin on
windowrule = match:class aurum-menubar, rounding 0
windowrule = match:class aurum-menubar, move 0 0

# aurum-dock: bottom centred, floating, pinned.
# Hyprland centres new floating windows by default. We explicitly pin the dock
# to bottom-centre with a percentage move expression: 50%-w/2 places its
# left edge at horizontal centre minus half its width; 100%-h-16 places the
# top edge 16 px above the bottom of the workspace. The launcher script also
# issues a `moveactive exact` as a belt-and-braces fallback for builds where
# the rule fires before the QML width has settled.
windowrule = match:class aurum-dock, float on
windowrule = match:class aurum-dock, pin on
windowrule = match:class aurum-dock, move 50%-w/2 100%-h-16
# Note: Hyprland 0.55 dropped per-window `noborder`/`bordersize` rules. The
# global 1-px border (general:border_size = 1) is hard-coded for the dock/
# menubar too. Both apps already draw their own glass edge / hairline which
# masks the system border, so it reads correctly — but to fully hide it on
# a per-window basis we'd need a Hyprland-side patch or to set the global
# border_size to 0 (which would affect tiled DL apps too — not desired).

# aurum-finder / aurum-settings / aurum-mission-control:
# regular floating windows (with their own Qt decorations off via the
# QT_WAYLAND_DISABLE_WINDOWDECORATION env var set in the launcher).
windowrule = match:class aurum-finder, float on
windowrule = match:class aurum-settings, float on
windowrule = match:class aurum-mission-control, float on
windowrule = match:class aurum-mission-control, pin on

# aurum-notifications: top-right corner, 380x600 stack. Pinned across workspaces
# so the notification rail stays visible while switching workspaces.
# Sized to 380x600 then placed at absolute (888, 40) — that's
# 1280 (monitor width) - 380 (window width) - 12 (right gutter) = 888 px
# and 28 (menubar height) + 12 (gap) = 40 px down from the top.
# NOTE: we use absolute coordinates rather than a `100%-w-12 40` percentage
# expression because Hyprland 0.55's `windowrule = move` silently fails to
# evaluate percentage-with-window-width forms at rule-apply time (the window
# width is still 0 when the move rule fires), falling back to centre-screen.
# The trade-off is that this position is tuned for the 1280x800 demo monitor;
# multi-monitor / different-resolution builds will need the QML to do its
# own anchoring (Notifications.qml already does this in Component.onCompleted
# via `x = Screen.width - width - 12`, but that only takes effect on builds
# of Hyprland that honour client-requested xdg-shell positions — most don't).
windowrule = match:class aurum-notifications, float on
windowrule = match:class aurum-notifications, pin on
windowrule = match:class aurum-notifications, size 380 600
windowrule = match:class aurum-notifications, move 888 40

# aurum-spotlight: floating overlay, centred on the active monitor.
windowrule = match:class aurum-spotlight, float on
windowrule = match:class aurum-spotlight, pin on
windowrule = match:class aurum-spotlight, center on

# Per-placeholder rules for the aurum-coming-soon stub windows. We list them
# explicitly rather than using a `match:class ^aurum-.*$` catch-all because
# the catch-all also matched the named applets above (menubar, dock, finder,
# notifications, etc.) and Hyprland applies rules in declaration order — the
# later `center on` from the catch-all was overriding earlier positioning
# (e.g. menubar `move 0 0` was being clobbered to centre-screen). Negative
# lookahead in the regex is fragile across Hyprland versions, so an explicit
# allow-list is the durable fix.
windowrule = match:class aurum-browser,     float on
windowrule = match:class aurum-browser,     center on
windowrule = match:class aurum-terminal,    float on
windowrule = match:class aurum-terminal,    center on
windowrule = match:class aurum-editor,      float on
windowrule = match:class aurum-editor,      center on
windowrule = match:class aurum-jupyterlab,  float on
windowrule = match:class aurum-jupyterlab,  center on
windowrule = match:class aurum-marimo,      float on
windowrule = match:class aurum-marimo,      center on
windowrule = match:class aurum-ollama,      float on
windowrule = match:class aurum-ollama,      center on
windowrule = match:class aurum-mlflow,      float on
windowrule = match:class aurum-mlflow,      center on
windowrule = match:class aurum-tensorboard, float on
windowrule = match:class aurum-tensorboard, center on
windowrule = match:class aurum-test,        float on
windowrule = match:class aurum-test,        center on

# Real third-party apps installed in the demo container — make them
# floating with reasonable initial sizes so they sit nicely against the
# dock at the bottom. Production install will let users dock/tile normally.
windowrule = match:class org.kde.falkon, float on
windowrule = match:class org.kde.falkon, size 1200 760
windowrule = match:class org.kde.falkon, center on

windowrule = match:class XTerm, float on
windowrule = match:class xterm, float on
windowrule = match:class XTerm, size 880 540
windowrule = match:class XTerm, center on
