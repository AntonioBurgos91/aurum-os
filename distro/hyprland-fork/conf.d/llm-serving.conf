# ==============================================================================
# AurumOS — LLM serving framework windowrules (Wave 8 Agent B)
# Sourced by aurum.conf via `source = /etc/aurum/hypr/conf.d/*.conf`.
#
# The 4 serving frameworks open either an xterm supervisor (vLLM/SGLang/TGI:
# the server logs scroll here) or a Falkon browser window (LiteLLM proxy admin
# UI). We float + center them so they don't fight the dock for space.
# ==============================================================================

# vLLM — high-performance batch inference (port 8000)
windowrule = match:class aurum-vllm, float on
windowrule = match:class aurum-vllm, size 1200 800
windowrule = match:class aurum-vllm, center on

# SGLang — structured-generation server (port 30000)
windowrule = match:class aurum-sglang, float on
windowrule = match:class aurum-sglang, size 1200 800
windowrule = match:class aurum-sglang, center on

# Text Generation Inference (TGI) — HF's Rust server (port 8080)
windowrule = match:class aurum-tgi, float on
windowrule = match:class aurum-tgi, size 1200 800
windowrule = match:class aurum-tgi, center on

# LiteLLM proxy — unified OpenAI/Anthropic/Ollama API on port 4000.
# This rule also matches the Falkon admin UI window (the launcher invokes
# Falkon with --wmclass aurum-litellm so this catches both panels).
windowrule = match:class aurum-litellm, float on
windowrule = match:class aurum-litellm, size 1100 750
windowrule = match:class aurum-litellm, center on
