# ==============================================================================
# AurumOS Hyprland conf.d — CV / Multimodal stack window rules (Agent F)
#
# Sourced from the main aurum.conf via a glob include. Adds floating+centred
# rules for the browser windows opened by Wave 8's CV/multimodal launchers.
#
# Windowrule grammar is Hyprland 0.53+ ("match:class X, action value"). See
# distro/hyprland-fork/aurum.conf for the rationale behind the explicit
# allow-list approach (catch-all regex matched named applets we wanted to
# leave alone).
# ==============================================================================

# aurum-comfyui — browser window pointing at http://127.0.0.1:8188.
# The .desktop file sets StartupWMClass=aurum-comfyui so the launching
# browser inherits this class via startup-notification. Floating + centred
# gives the node graph a usable canvas without dock interference.
windowrule = match:class aurum-comfyui, float on
windowrule = match:class aurum-comfyui, size 1400 900
windowrule = match:class aurum-comfyui, center on

# aurum-llava / aurum-internvl / aurum-qwen2vl — placeholders for any future
# stand-alone multimodal chat windows (currently launched via JupyterLab,
# which has its own rule in aurum.conf). Listed here so when the CV stack
# grows a dedicated multimodal chat UI it slots in without a config bump.
windowrule = match:class aurum-llava,    float on
windowrule = match:class aurum-llava,    center on
windowrule = match:class aurum-internvl, float on
windowrule = match:class aurum-internvl, center on
windowrule = match:class aurum-qwen2vl,  float on
windowrule = match:class aurum-qwen2vl,  center on
