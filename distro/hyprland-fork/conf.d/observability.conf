# AurumOS — Hyprland windowrules for the observability stack (Wave 8, Agent E)
#
# Both Langfuse and Phoenix are web UIs we open with Falkon. We pass
# --wmclass so Hyprland sees them as distinct windows (not generic "Falkon")
# and can size + float them like AurumOS-native applets.
#
# Conventions adopted from distro/hyprland-fork/aurum.conf:
#   * Hyprland 0.53+ grammar: `match:class <name>` matcher form.
#   * No `noborder` (removed in 0.55). Apps live with the global 1 px border.
#   * Centered floating window, sensible default size.

# Langfuse dashboard — needs vertical space for trace flame graphs.
windowrule = match:class aurum-langfuse, float on
windowrule = match:class aurum-langfuse, size 1280 800
windowrule = match:class aurum-langfuse, center on

# Phoenix UI — span detail view also benefits from a tall window.
windowrule = match:class aurum-phoenix, float on
windowrule = match:class aurum-phoenix, size 1200 780
windowrule = match:class aurum-phoenix, center on
