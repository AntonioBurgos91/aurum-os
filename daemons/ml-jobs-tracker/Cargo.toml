[package]
name = "ml-jobs-tracker"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "AurumOS: poll MLflow tracking server, expose active runs over D-Bus"
license = "MIT"

[[bin]]
name = "aurum-ml-jobs-tracker"
path = "src/main.rs"

[dependencies]
# NOTE: tokio + zbus versions are pinned identically across all three
# daemons (gpu-monitor, spotlight-indexer, ml-jobs-tracker) so they share
# one Cargo lock-resolved copy.
tokio       = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
zbus        = { version = "4.4",  default-features = false, features = ["tokio"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
toml        = "0.8"
dirs        = "5.0"
log         = "0.4"
env_logger  = "0.11"

[dev-dependencies]
tokio    = { version = "1.38", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
