# ==============================================================================
# AurumOS - window rules for the LLM workflow notebook launcher
# Sourced from /etc/aurum/hypr/aurum.conf via `source = .../conf.d/*.conf`.
#
# `aurum-workflows` is a desktop entry that opens JupyterLab in the recipes/
# directory. The actual window the user interacts with is therefore a *browser*
# tab; the matching pattern follows the same convention as the third-party app
# rules in aurum.conf (match the browser's wm class).
#
# We match BOTH likely browsers (Falkon ships with AurumOS by default;
# Firefox is the common fallback) so the rule fires regardless of which
# browser xdg-open spawns. The StartupWMClass=aurum-workflows in the .desktop
# entry doesn't survive the hop into the browser process, so we fall back to
# matching the browser itself - same approach aurum.conf already uses for
# `org.kde.falkon`.
# ==============================================================================

# Float + size + center for the Falkon window that ends up hosting JupyterLab
# when launched from the AurumOS LLM Workflows desktop entry. The base
# `org.kde.falkon` rules in aurum.conf already set float+center; here we
# tighten the size to JupyterLab's preferred 1300x800 layout.
windowrule = match:class org.kde.falkon, float on
windowrule = match:class org.kde.falkon, size 1300 800
windowrule = match:class org.kde.falkon, center on

# Firefox fallback - same shape.
windowrule = match:class firefox, float on
windowrule = match:class firefox, size 1300 800
windowrule = match:class firefox, center on

# If a window ever does carry the StartupWMClass through (some launchers do),
# match it directly too - belt and braces.
windowrule = match:class aurum-workflows, float on
windowrule = match:class aurum-workflows, size 1300 800
windowrule = match:class aurum-workflows, center on
