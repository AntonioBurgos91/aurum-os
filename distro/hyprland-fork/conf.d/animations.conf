# ==============================================================================
# AurumOS — selective compositor animations (Wave 10 Agent F)
# Loaded by aurum.conf via `source = /etc/aurum/hypr/conf.d/*.conf`.
#
# Override the global `animations { enabled = false }` from aurum.conf with a
# tight set that's barely perceptible during normal use but produces ZERO frames
# during DL workloads (no continuous animations, no workspace switches, no
# border animations).
#
# Policy: animate ONLY transient events the user explicitly triggered (window
# open/close, Spotlight invoke). Background motion is forbidden — see
# docs/adr/0006-performance-budget.md for the rationale and
# docs/internal/animation-policy.md for the per-event whitelist.
# ==============================================================================

animations {
    enabled = true

    # Reset: nuke every default animation, then re-add only what we want.
    # Hyprland 0.50+ syntax: `animation = <name>, <on/off>, <duration*100ms>, <bezier>`
    animation = global, 0
    animation = windows, 0
    animation = windowsIn, 0
    animation = windowsOut, 0
    animation = windowsMove, 0
    animation = layers, 0
    animation = layersIn, 0
    animation = layersOut, 0
    animation = fade, 0
    animation = fadeIn, 0
    animation = fadeOut, 0
    animation = border, 0
    animation = borderangle, 0
    animation = workspaces, 0
    animation = workspacesIn, 0
    animation = workspacesOut, 0
    animation = specialWorkspace, 0

    # Re-enable only the 3 transient ones:
    bezier = aurumEaseOut, 0.16, 1, 0.3, 1
    animation = windowsIn,        1, 1.5, aurumEaseOut, popin 95%
    animation = windowsOut,       1, 1,   aurumEaseOut, popin 95%
    animation = specialWorkspace, 1, 2,   aurumEaseOut, fade
    # (fade for layers — affects xdg-shell layers like notifications/menubar — stays off)
}
