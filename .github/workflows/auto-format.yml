name: Auto Format

# Triggered manually OR when this workflow file changes.
# Runs formatters on the entire codebase and commits changes back to main.

on:
  workflow_dispatch:
    inputs:
      run_rust:
        description: "Run cargo fmt on Rust crates"
        type: boolean
        default: true
      run_cpp:
        description: "Run clang-format on C++ files"
        type: boolean
        default: true
      run_shellcheck_report:
        description: "Generate shellcheck report (non-blocking, for review)"
        type: boolean
        default: true
  # Auto-runs whenever this workflow file is modified, so changes to the
  # workflow itself bootstrap a formatting pass without a manual click.
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-format.yml"

permissions:
  contents: write

jobs:
  auto-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ---------- Rust ----------
      - name: Install Rust toolchain
        if: ${{ github.event_name == 'push' || inputs.run_rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run cargo fmt on all crates
        if: ${{ github.event_name == 'push' || inputs.run_rust }}
        run: |
          set -e
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker tools/aurum-mockup; do
            if [ -f "$d/Cargo.toml" ]; then
              echo "=== cargo fmt: $d ==="
              cargo fmt --manifest-path "$d/Cargo.toml"
            else
              echo "skip: $d/Cargo.toml not found"
            fi
          done

      # ---------- C++ ----------
      - name: Install clang-format
        if: ${{ github.event_name == 'push' || inputs.run_cpp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format on desktop/ and libs/
        if: ${{ github.event_name == 'push' || inputs.run_cpp }}
        run: |
          set -e
          find desktop libs \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" \) -type f -print0 \
            | xargs -0 -r clang-format -i

      # ---------- Shellcheck (report only, does not fix) ----------
      - name: Install shellcheck
        if: ${{ github.event_name == 'push' || inputs.run_shellcheck_report }}
        run: sudo apt-get install -y shellcheck

      - name: Generate shellcheck report
        if: ${{ github.event_name == 'push' || inputs.run_shellcheck_report }}
        continue-on-error: true
        run: |
          mkdir -p .ci-reports
          find . -name "*.sh" \
            -not -path "./build/*" \
            -not -path "./target/*" \
            -not -path "./.git/*" \
            -print0 \
          | xargs -0 -r shellcheck -S warning -f gcc 2>&1 \
          | tee .ci-reports/shellcheck.txt || true
          echo "---"
          echo "Total shellcheck warnings: $(wc -l < .ci-reports/shellcheck.txt || echo 0)"

      - name: Upload shellcheck report
        if: ${{ github.event_name == 'push' || inputs.run_shellcheck_report }}
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-report
          path: .ci-reports/shellcheck.txt
          if-no-files-found: ignore

      # ---------- Commit & push ----------
      - name: Show diff stats
        run: |
          echo "=== Modified files ==="
          git diff --stat || true
          echo "=== Status ==="
          git status --short || true

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add -A ':!.ci-reports'

          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi

          git commit -m "style: apply cargo fmt + clang-format via auto-format workflow

Auto-generated by .github/workflows/auto-format.yml
- cargo fmt across daemons/* and tools/aurum-mockup
- clang-format -i across desktop/ and libs/
- shellcheck report available as workflow artifact

[skip ci]"

          git push
          echo "✅ Formatting fixes pushed to ${GITHUB_REF#refs/heads/}"
