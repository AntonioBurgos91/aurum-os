# AurumOS — Hyprland windowrules for AI-augmented coding launchers
# (Agent D / Wave 8)
#
# The two .desktop entries (desktop/applications/aurum-aider.desktop and
# desktop/applications/aurum-claude-code.desktop) launch xterm with
# `-class aurum-aider` / `-class aurum-claude-code` respectively. Hyprland's
# matcher uses the X11 WM_CLASS for XWayland clients, so these strings must
# match the StartupWMClass values in the .desktop files.
#
# Sourced from distro/hyprland-fork/aurum.conf via:
#     source = /etc/aurum/hypr/conf.d/*.conf
#
# Sizing: 1100x700 matches the other Wave 8 terminal launchers (aurum-finetune)
# so the user gets a consistent floating-terminal footprint regardless of which
# AI assistant they spawn. Both float + centre rather than tile because they
# are conversational CLIs, not background services — users typically alt-tab
# back to the editor between turns.

windowrule = match:class aurum-aider,       float on
windowrule = match:class aurum-aider,       size 1100 700
windowrule = match:class aurum-aider,       center on

windowrule = match:class aurum-claude-code, float on
windowrule = match:class aurum-claude-code, size 1100 700
windowrule = match:class aurum-claude-code, center on
