# ==============================================================================
# AurumOS Hyprland Configuration (macOS Sequoia UX adaptation)
#
# Compositor-wide defaults are pinned in /etc/aurum/hypr/aurum.conf and sourced
# below. Everything in THIS file is user-overridable per-machine.
# ==============================================================================

source = /etc/aurum/hypr/aurum.conf

# --- Monitors ---
# Reserve 28 px at the top (menubar) and 88 px at the bottom (dock) so tiled
# windows don't overlap the AurumOS chrome. Adjust per-monitor if needed.
monitor = , preferred, auto, 1, reserved, 28, 88, 0, 0

# --- Autostart ---
# gpu-monitor is launched by its systemd user unit (aurum-gpu-monitor.service),
# pulled in by graphical-session.target — not by exec-once here, so it survives
# a Hyprland restart.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start aurum-gpu-monitor.service
exec-once = systemctl --user start aurum-spotlight-indexer.service
exec-once = systemctl --user start aurum-ml-jobs-tracker.service
exec-once = ~/.config/hypr/wallpaper.sh
exec-once = aurum-menubar
exec-once = aurum-dock
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- Environment ---
env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# --- Input ---
input {
    kb_layout = us,es
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }

    sensitivity = 0
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_invert = false
    workspace_swipe_distance = 300
    workspace_swipe_min_speed_to_force = 30
}

# ==============================================================================
# Keyboard — macOS-style bindings
#
# Convention: SUPER is the physical Cmd key (Apple keyboards) or the Win key
# (PC keyboards). The compositor cannot intercept inside-app shortcuts such as
# Cmd+C/V/X — those are routed to the focused application natively. What we
# DO bind here is window-manager-level behavior that maps to macOS muscle
# memory.
# ==============================================================================

$mainMod = SUPER

# --- App launching / system ---
bind = $mainMod, Return,       exec, ghostty                     # Cmd+Return: terminal
bind = $mainMod, Space,        exec, aurum-spotlight              # Cmd+Space: Spotlight
bind = $mainMod, E,            exec, aurum-finder                 # Cmd+E: Finder (override)
bind = $mainMod, comma,        exec, aurum-settings               # Cmd+,: Preferences
bind = $mainMod CTRL, Q,       exec, loginctl lock-session        # Cmd+Ctrl+Q: lock screen
bind = $mainMod SHIFT, Q,      exec, wlogout                      # Cmd+Shift+Q: log out menu

# --- Window lifecycle ---
bind = $mainMod, Q,            killactive,                        # Cmd+Q: quit window
bind = $mainMod, W,            killactive,                        # Cmd+W: close window (alias on Wayland)
bind = $mainMod, M,            exec, hyprctl dispatch movetoworkspacesilent special:minimized active
                                                                  # Cmd+M: "minimize" → scratchpad workspace
bind = $mainMod, H,            exec, hyprctl dispatch movetoworkspacesilent special:hidden active
                                                                  # Cmd+H: "hide"   → scratchpad workspace
bind = $mainMod SHIFT, H,      togglespecialworkspace, hidden     # Cmd+Shift+H: toggle visibility
bind = $mainMod, F,            fullscreen, 1                      # Cmd+F: fullscreen (maximize-style)
bind = $mainMod CTRL, F,       fullscreen, 0                      # Cmd+Ctrl+F: true fullscreen (macOS green button)

# --- App switching (Cmd+Tab analogue) ---
bind = ALT, Tab,               cyclenext,
bind = ALT, Tab,               bringactivetotop,
bind = ALT SHIFT, Tab,         cyclenext, prev
bind = ALT SHIFT, Tab,         bringactivetotop,

# --- Mission Control / Exposé (macOS uppercut gestures) ---
bind = $mainMod, up,           exec, aurum-mission-control        # Cmd+Up: Mission Control
bind = , F3,                   exec, aurum-mission-control        # F3 hardware key: Mission Control
bind = CTRL, up,               exec, aurum-mission-control        # Ctrl+Up: same as macOS

# --- Window tiling extras (no macOS analogue but useful) ---
bind = $mainMod, V,            togglefloating,
bind = $mainMod, P,            pseudo,
bind = $mainMod, J,            togglesplit,

# --- Focus movement (Cmd + arrows on macOS does navigation; we map to focus) ---
bind = $mainMod ALT, left,     movefocus, l
bind = $mainMod ALT, right,    movefocus, r
bind = $mainMod ALT, up,       movefocus, u
bind = $mainMod ALT, down,     movefocus, d

# --- Move windows ---
bind = $mainMod SHIFT, left,   movewindow, l
bind = $mainMod SHIFT, right,  movewindow, r
bind = $mainMod SHIFT, up,     movewindow, u
bind = $mainMod SHIFT, down,   movewindow, d

# --- Workspaces (Cmd + number = Spaces 1..10) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Ctrl + Left/Right = switch Space (macOS muscle memory)
bind = CTRL, left,             workspace, e-1
bind = CTRL, right,            workspace, e+1

# Move window to workspace (Cmd+Shift+number)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Screenshots (macOS Cmd+Shift+3/4/5) ---
# 3: whole screen → file; 4: selection → file; 5: selection → clipboard
bind = $mainMod SHIFT, 3, exec, grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = $mainMod SHIFT, 4, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = $mainMod SHIFT, 5, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print,           exec, grim -g "$(slurp)" - | wl-copy

# --- Clipboard manager (Cmd+Shift+V is the de-facto clipboard-history binding) ---
bind = $mainMod SHIFT, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

# --- Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Multimedia / hardware keys ---
binde = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind  = , XF86AudioPlay,         exec, playerctl play-pause
bind  = , XF86AudioNext,         exec, playerctl next
bind  = , XF86AudioPrev,         exec, playerctl previous
binde = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
binde = , XF86KbdBrightnessUp,   exec, brightnessctl --device='*kbd_backlight' set 10%+
binde = , XF86KbdBrightnessDown, exec, brightnessctl --device='*kbd_backlight' set 10%-
