# AurumOS Hyprland preview — NVIDIA EGL, solo VIRTUAL-1 para VNC
source = /etc/aurum/hypr/aurum.conf

# Solo VIRTUAL-1 activo para el preview — los monitores físicos
# rechazan modos en contenedor (REJECTED preferred mode) y bloquean el compositor
monitor = VIRTUAL-1, 1280x800@60, 0x0, 1
monitor = HDMI-A-1, disabled
monitor = DP-1, disabled

# Workspace 1 en VIRTUAL-1
workspace = 1, monitor:VIRTUAL-1, default:true

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity  = 0
}

$mainMod = SUPER
bind = $mainMod, Space, exec, aurum-spotlight
bind = $mainMod, Q,    killactive,
bind = $mainMod, F,    fullscreen,

# misc {} block lives in aurum.conf — preview inherits it. Don't re-declare
# disable_hyprland_logo / disable_splash_rendering / force_default_wallpaper /
# enable_swallow here (they were duplicates of the upstream values).

cursor {
    no_hardware_cursors = true
}

# Debug mínimo — sin stdout logs para no activar el error overlay
debug {
    disable_logs       = true
    enable_stdout_logs = false
    overlay            = false
}
