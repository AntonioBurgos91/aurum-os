name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --- lint -------------------------------------------------------------
  lint-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: |
          find . -name "*.sh" -not -path "./build/*" -not -path "./target/*" | \
            xargs shellcheck -S warning

  lint-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find desktop libs -name "*.cpp" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror

  lint-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format check
        run: |
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker tools/aurum-mockup; do
            cargo fmt --manifest-path $d/Cargo.toml -- --check
          done
      - name: Clippy
        run: |
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker; do
            cargo clippy --manifest-path $d/Cargo.toml --release -- -D warnings
          done

  # --- build + test -----------------------------------------------------
  build-rust:
    runs-on: ubuntu-24.04
    needs: lint-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemons/gpu-monitor
            daemons/spotlight-indexer
            daemons/ml-jobs-tracker
            tools/aurum-mockup
      - name: Build
        run: |
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker tools/aurum-mockup; do
            echo "=== build $d ==="
            cargo build --manifest-path $d/Cargo.toml --release
          done
      - name: Test
        run: |
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker; do
            cargo test --manifest-path $d/Cargo.toml --release
          done

  build-cpp:
    runs-on: ubuntu-24.04
    needs: [lint-cpp, lint-shell]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-wayland \
            libwayland-dev libxkbcommon-dev \
            libwlroots-dev libdrm-dev libpixman-1-dev \
            libvulkan-dev \
            python3 python3-pip
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_DESKTOP=ON -DBUILD_LIBS=ON -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test (C++ + Qt unit tests)
        run: cd build && ctest --output-on-failure

  # --- smoke (integration, slowest) -------------------------------------
  # Builds aurumos:dev → aurumos:desktop using classic `docker build` so both
  # tags live on the same Docker daemon and the second build can resolve
  # `FROM aurumos:dev` locally. We tried buildx + GHA layer cache before but
  # buildx with the docker-container driver runs in an isolated builder that
  # doesn't share images with the host daemon — so the FROM lookup fell
  # through to docker.io and 401'd. Trade-off: every push pays the full cold
  # build cost (~25 min). Layer cache can be re-introduced later via a
  # multi-stage Dockerfile that fuses both images into one.
  smoke:
    runs-on: ubuntu-24.04
    needs: [build-rust, build-cpp]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # The runner ships with ~14 GB free. aurumos:dev pulls ~2 GB of Qt6 +
        # Rust + clang-18, aurumos:desktop adds Hyprland + a full CMake build
        # (~3-4 GB). Pre-emptively delete the preinstalled toolchains we
        # don't need (Android SDK, .NET, large Hosted Tool Cache entries) so
        # the second build doesn't ENOSPC mid-way.
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          echo "After:"; df -h /

      - name: Build aurumos:dev (base toolchain)
        run: |
          echo "=== building aurumos:dev (cold ~10-12 min) ==="
          docker build -t aurumos:dev .

      - name: Build aurumos:desktop (Hyprland + Qt + Rust daemons)
        run: |
          echo "=== building aurumos:desktop (cold ~10-15 min) ==="
          docker build -f distro/demo/Dockerfile.desktop -t aurumos:desktop .

      - name: Start container
        run: |
          docker run -d --name aurum-desktop \
            -p 6080:6080 -p 5900:5900 \
            -e GPU_BACKEND=headless \
            aurumos:desktop

      - name: Wait for noVNC to come up
        run: |
          # Poll the noVNC HTML5 endpoint until it answers (max 90s). The
          # compositor + daemons take variable time to wire up in the
          # headless backend, so a blind `sleep 30` was a coin-flip.
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:6080/vnc.html >/dev/null 2>&1; then
              echo "noVNC ready after ${i}*2s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::noVNC never came up — dumping container logs"
          docker logs aurum-desktop | tail -100
          exit 1

      - name: Run smoke
        run: ./tools/smoke-test.sh --json | tee smoke-output.json

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== docker logs aurum-desktop ==="
          docker logs aurum-desktop || true
          echo "=== /var/log/aurum/* ==="
          docker exec aurum-desktop bash -c 'tail -200 /var/log/aurum/*.log 2>/dev/null' || true

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: smoke-output.json
