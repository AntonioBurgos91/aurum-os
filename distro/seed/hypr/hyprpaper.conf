# AurumOS hyprpaper configuration
#
# This file is consumed only when the wallpaper-engine script
# (distro/seed/hypr/wallpaper.sh) decides to fall back to `hyprpaper`
# instead of the preferred `swww` / `swaybg` backends — see that script
# for the priority order. Most installs never load this file; it exists
# so the iso-builder can include hyprpaper in the "minimal Wayland
# wallpaper backends" trio without leaving it un-configured.
#
# Default ships aurum-amber (the tier "pro" signature wallpaper). Tier
# defaults can be overridden at install time by the post-install profile
# detector — see distro/post-install/00-detect-profile.sh.

preload = /usr/share/backgrounds/aurumos/sequoia-aurum-amber.png

wallpaper = ,/usr/share/backgrounds/aurumos/sequoia-aurum-amber.png

# Honour Hyprland's built-in IPC so swww / aurum-settings can hot-swap
# the wallpaper without restarting hyprpaper.
ipc = on

# Pre-cache scaled buffers so the first frame on a high-DPI display
# arrives in <16 ms. With six 3840x2400 wallpapers in the rotation
# directory this costs ~36 MB resident.
splash = false
