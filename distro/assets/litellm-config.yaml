# /etc/aurum/litellm-config.yaml — AurumOS LiteLLM proxy default config.
#
# LiteLLM exposes ONE OpenAI-compatible endpoint at http://localhost:4000/v1
# that fans out to whichever upstream the user calls by model_name. This lets
# recipes target `gpt-4o` or `qwen-local` with the same client code, and lets
# users swap a cloud key for a local model without touching their scripts.
#
# Sourced by aurum-launch-litellm. Users can edit this file freely; the
# launcher just passes --config to `litellm`.
#
# Adding more models:
#   model_list:
#     - model_name: <whatever-you-want-to-call-it>
#       litellm_params:
#         model: <provider>/<upstream-model-id>
#         api_key: os.environ/<ENV_VAR>          # for cloud
#         api_base: http://...                   # for self-hosted
#
# See https://docs.litellm.ai/docs/proxy/configs for the full schema.

model_list:
  # --- Cloud frontier models ------------------------------------------------
  # api_key resolves at request time from the process env; if the user hasn't
  # set OPENAI_API_KEY / ANTHROPIC_API_KEY, the proxy still starts cleanly and
  # only fails when that specific model is invoked.
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Local models served by Ollama (Wave 7, port 11434) -------------------
  # `ollama_chat/` (not bare `ollama/`) routes through Ollama's /api/chat
  # endpoint, which gives tool-call + system-message handling that the bare
  # /api/generate endpoint lacks.
  - model_name: qwen-local
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://localhost:11434

  - model_name: llama-local
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://localhost:11434

litellm_settings:
  # Silently strip provider-specific kwargs that the *target* model doesn't
  # understand (e.g. `tool_choice` against an Ollama llama3.2 deployment that
  # doesn't speak tool-use). Without this, recipes written for OpenAI fail
  # the moment they're routed to a local model.
  drop_params: true

general_settings:
  # Bind on all interfaces so other machines on the LAN can hit the proxy
  # (useful when one workstation has the GPU and others want OpenAI-shape
  # access to it). Tighten to 127.0.0.1 in /etc/aurum/litellm-config.yaml
  # for single-user laptops if exposure is a concern.
  port: 4000
