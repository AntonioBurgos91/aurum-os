[package]
name = "spotlight-indexer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "AurumOS Spotlight: tantivy-backed file indexer with live inotify updates and D-Bus query interface"
license = "MIT"

[[bin]]
name = "aurum-spotlight-indexer"
path = "src/main.rs"

[dependencies]
# NOTE: tokio + zbus versions are pinned identically across all three
# daemons (gpu-monitor, spotlight-indexer, ml-jobs-tracker) so they share
# one Cargo lock-resolved copy.
tokio       = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
zbus        = { version = "4.4",  default-features = false, features = ["tokio"] }
tantivy     = "0.22"
walkdir     = "2.5"
notify      = "6.1"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
dirs        = "5.0"
log         = "0.4"
env_logger  = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
