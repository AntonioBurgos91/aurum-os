# AurumOS — self-hosted Langfuse stack
# Copied to /opt/aurum-langfuse/docker-compose.yml by 10-install-observability.sh
# (only on standard|pro|workstation profiles; lite users get a cloud pointer
# instead — see docs/guides/observability.md).
#
# Layout:
#   langfuse-server  ── port 3030 (host) → 3000 (container)
#   langfuse-db      ── postgres 16, bind-mounted to /var/lib/aurum-langfuse/db
#
# Why 3030 not 3000: avoids conflict with anything else AurumOS users routinely
# run on 3000 (Grafana, Next.js dev servers, etc.). Internal port stays 3000 —
# only the host-side mapping changes.
#
# Why bind mount (not named volume): aligns with AurumOS's /var/lib/<service>/
# convention so users can back up, snapshot, or move state with standard tools
# instead of `docker volume inspect`. Trade-off: directory must exist + be
# writable before `up`. The install script handles that.

services:
  langfuse-db:
    image: postgres:16-alpine
    container_name: aurum-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - /var/lib/aurum-langfuse/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: aurum-langfuse-server
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      # External 3030 → internal 3000 (Langfuse's hard-coded listen port).
      - "3030:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      # NEXTAUTH_URL / SECRET / SALT are sourced from the .env file the install
      # script generates at /opt/aurum-langfuse/.env. Compose reads .env from
      # the project directory automatically; we re-export here so they are
      # visible to the container env (not just compose substitution).
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3030}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      # Seed an initial org + admin user so users can log in on first launch
      # without going through the Langfuse signup flow.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-aurum}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@aurum.local}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-aurum-default-changeme}
      # Telemetry off by default — AurumOS principle: nothing phones home
      # without an explicit user opt-in.
      TELEMETRY_ENABLED: "false"
