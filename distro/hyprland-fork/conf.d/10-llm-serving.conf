# ============================================================================
# Wave 8 / Agent B — LLM serving stack window rules.
#
# All four launchers spawn either Falkon (with --wmclass <something>) pointed
# at the server's web UI, or an XTerm fallback. Either way the wmclass is one
# of:
#
#   aurum-litellm   — LiteLLM proxy OpenAPI UI (port 4000)
#   aurum-vllm      — vLLM /docs OpenAPI UI    (port 8000)
#   aurum-sglang    — SGLang web UI            (port 30000)
#   aurum-tgi       — TGI web UI               (port 8080)
#
# Convention from distro/hyprland-fork/conf.d/README.md: each app gets float +
# center + a comfortable initial size (we use 1200x800, matching Falkon's
# default profile for in-app browsing).
# ============================================================================

windowrule = match:class aurum-litellm, float on
windowrule = match:class aurum-litellm, center on
windowrule = match:class aurum-litellm, size 1200 800

windowrule = match:class aurum-vllm, float on
windowrule = match:class aurum-vllm, center on
windowrule = match:class aurum-vllm, size 1200 800

windowrule = match:class aurum-sglang, float on
windowrule = match:class aurum-sglang, center on
windowrule = match:class aurum-sglang, size 1200 800

windowrule = match:class aurum-tgi, float on
windowrule = match:class aurum-tgi, center on
windowrule = match:class aurum-tgi, size 1200 800
