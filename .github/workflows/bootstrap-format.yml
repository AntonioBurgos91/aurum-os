name: Bootstrap Format

# One-shot workflow that runs formatters on the codebase.
# Triggers on any push to main + any change to this file.
# After it pushes its fix commit (with [skip ci]), it won't re-trigger itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    # Skip if this is the bot's own commit, to prevent any loop possibility
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ---------- Rust ----------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        run: |
          set -e
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker tools/aurum-mockup; do
            if [ -f "$d/Cargo.toml" ]; then
              echo "=== cargo fmt: $d ==="
              cargo fmt --manifest-path "$d/Cargo.toml"
            fi
          done

      # ---------- C++ ----------
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: clang-format -i
        run: |
          set -e
          find desktop libs \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" \) -type f -print0 \
            | xargs -0 -r clang-format -i || true

      # ---------- Shellcheck (report) ----------
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck report
        continue-on-error: true
        run: |
          mkdir -p .ci-reports
          find . -name "*.sh" \
            -not -path "./build/*" \
            -not -path "./target/*" \
            -not -path "./.git/*" \
            -print0 \
          | xargs -0 -r shellcheck -S warning -f gcc 2>&1 \
          | tee .ci-reports/shellcheck.txt || true
          echo "---"
          echo "Total shellcheck issues: $(wc -l < .ci-reports/shellcheck.txt || echo 0)"

      - name: Upload shellcheck report
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-report
          path: .ci-reports/shellcheck.txt
          if-no-files-found: ignore

      # ---------- Diff & commit ----------
      - name: Show diff
        run: |
          echo "=== Diff stat ==="
          git diff --stat || true
          echo "=== Files modified ==="
          git status --short || true

      - name: Commit & push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A ':!.ci-reports'

          if git diff --cached --quiet; then
            echo "Nothing to format. Codebase is already clean."
            exit 0
          fi

          git commit -m "style: bootstrap-format cargo fmt + clang-format [skip ci]"
          git push
          echo "Pushed formatting fixes."
