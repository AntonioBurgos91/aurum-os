name: Auto Format (manual)

# Manual-only workflow for ad-hoc reformatting passes with options.
# Routine formatting is checked by ci.yml on every push; this one applies
# fixes on demand via the Actions "Run workflow" button.

on:
  workflow_dispatch:
    inputs:
      run_rust:
        description: "Run cargo fmt on Rust crates"
        type: boolean
        default: true
      run_cpp:
        description: "Run clang-format on C++ files"
        type: boolean
        default: true
      run_shellcheck_report:
        description: "Generate shellcheck report"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  auto-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        if: ${{ inputs.run_rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt
        if: ${{ inputs.run_rust }}
        run: |
          set -e
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker tools/aurum-mockup; do
            if [ -f "$d/Cargo.toml" ]; then
              cargo fmt --manifest-path "$d/Cargo.toml"
            fi
          done

      - name: Install clang-format
        if: ${{ inputs.run_cpp }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: clang-format -i
        if: ${{ inputs.run_cpp }}
        run: |
          find desktop libs \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" \) -type f -print0 \
            | xargs -0 -r clang-format -i

      - name: Install shellcheck
        if: ${{ inputs.run_shellcheck_report }}
        run: sudo apt-get install -y shellcheck

      - name: shellcheck report
        if: ${{ inputs.run_shellcheck_report }}
        continue-on-error: true
        run: |
          mkdir -p .ci-reports
          find . -name "*.sh" -not -path "./build/*" -not -path "./target/*" -not -path "./.git/*" -print0 \
          | xargs -0 -r shellcheck -S warning -f gcc 2>&1 \
          | tee .ci-reports/shellcheck.txt || true

      - name: Upload shellcheck report
        if: ${{ inputs.run_shellcheck_report }}
        uses: actions/upload-artifact@v4
        with:
          name: shellcheck-report
          path: .ci-reports/shellcheck.txt
          if-no-files-found: ignore

      - name: Commit & push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A ':!.ci-reports'
          if git diff --cached --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git commit -m "style: auto-format (manual) [skip ci]"
          git push
