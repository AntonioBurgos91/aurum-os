name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --- lint -------------------------------------------------------------
  lint-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: |
          find . -name "*.sh" -not -path "./build/*" -not -path "./target/*" | \
            xargs shellcheck -S warning

  test-shell:
    name: Shell unit tests (updater)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run updater unit tests
        run: bash tests/shell/test_aurum_update.sh

  test-cv-training:
    name: CV trainer smoke (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps (CPU torch)
        run: |
          pip install numpy scikit-learn
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run trainer smoke test
        run: python3 apps/pointcloud-viewer/training/test_smoke.py

  lint-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find desktop libs -name "*.cpp" -o -name "*.h" | \
            xargs clang-format --dry-run --Werror

  lint-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Format check
        run: |
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker tools/aurum-mockup; do
            cargo fmt --manifest-path $d/Cargo.toml -- --check
          done
      - name: Clippy
        run: |
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker; do
            cargo clippy --manifest-path $d/Cargo.toml --release -- -D warnings
          done

  # --- build + test -----------------------------------------------------
  build-rust:
    runs-on: ubuntu-24.04
    needs: lint-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            daemons/gpu-monitor
            daemons/spotlight-indexer
            daemons/ml-jobs-tracker
            tools/aurum-mockup
      - name: Build
        run: |
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker tools/aurum-mockup; do
            echo "=== build $d ==="
            cargo build --manifest-path $d/Cargo.toml --release
          done
      - name: Test
        run: |
          for d in daemons/gpu-monitor daemons/spotlight-indexer daemons/ml-jobs-tracker; do
            cargo test --manifest-path $d/Cargo.toml --release
          done

  build-cpp:
    runs-on: ubuntu-24.04
    needs: [lint-cpp, lint-shell]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-wayland \
            libwayland-dev libxkbcommon-dev \
            libwlroots-dev libdrm-dev libpixman-1-dev \
            libvulkan-dev \
            python3 python3-pip
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_DESKTOP=ON -DBUILD_LIBS=ON -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test (C++ + Qt unit tests)
        run: cd build && ctest --output-on-failure

  # NOTE: The full integration smoke (docker build + Hyprland headless + smoke-test.sh)
  # lives in .github/workflows/smoke-release.yml and runs ONLY on tagged releases.
  # It is too brittle / slow (~25 min cold) to gate every push: Hyprland headless
  # in GitHub Actions is on the edge of what the runner environment supports.
  # Run locally via:  bash distro/demo/run-preview.sh
